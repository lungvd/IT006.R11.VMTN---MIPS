name: MIPS Auto-Grader

on:
  push:
    branches:
      - main

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run MARS
        run: |
          java -jar Mars4_5.jar nc main.asm > output.txt

      - name: Check answer
        run: |
          OUTPUT=$(tail -n 1 output.txt | tr -d '\r')
          EXPECTED=$(cat expected.txt | tr -d '\r')

          echo "Student output:  $OUTPUT"
          echo "Expected output: $EXPECTED"

          if [ "$OUTPUT" = "$EXPECTED" ]; then
            echo "================================"
            echo "PASS - Correct answer!"
            echo "================================"
          else
            echo "================================"
            echo "FAIL - Incorrect answer!"
            echo "Expected: $EXPECTED"
            echo "Got:      $OUTPUT"
            echo "================================"
            exit 1
          fi
