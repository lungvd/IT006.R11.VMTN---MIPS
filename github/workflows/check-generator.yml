
name: Chapter 3 - Generator Tests

on:
  push:
    branches:
      - Chapter3-Arithmetic-lap
    paths:
      - "chapter3/generator/**"
      - ".github/workflows/chapter3-generator.yml"
  pull_request:
    paths:
      - "chapter3/generator/**"
      - ".github/workflows/chapter3-generator.yml"
  workflow_dispatch:

jobs:
  test-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generator tests
        working-directory: chapter3/generator
        run: python -m unittest -v test_generator.py

